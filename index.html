<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Studio — Fish Gang Co.</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--deep); }

  .cs-toolbar { display: flex; gap: var(--sp-2); align-items: center; padding: var(--sp-2) var(--sp-3); background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; flex-shrink: 0; }
  .cs-toolbar button { font-family: var(--font-display); font-size: 0.82rem; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; }
  .cs-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  .cs-toolbar button.run { background: var(--accent); color: var(--deep); border-color: var(--accent); font-weight: 600; }
  .cs-toolbar .spacer { flex: 1; }
  .cs-toolbar .meta { font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-display); }

  .cs-main { flex: 1; display: flex; min-height: 0; }
  .cs-sidebar { width: 210px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: width var(--t-fast) var(--ease); }
  html[data-motion="static"] .cs-sidebar { transition: none; }
  .cs-sidebar.collapsed { width: 0; overflow: hidden; }
  .cs-sidebar-head { padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .cs-sidebar-head button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1rem; }
  .cs-tree { flex: 1; overflow-y: auto; padding: var(--sp-2); }
  .cs-tree-item { padding: 6px 8px; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 0.85rem; }
  .cs-tree-item:hover { background: var(--surface-2); }
  .cs-tree-item.selected { background: var(--surface-2); color: var(--accent); }
  .cs-tree-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cs-tree-item .del { opacity: 0.5; font-size: 0.8rem; }
  .cs-tree-item .del:hover { opacity: 1; color: var(--danger); }

  .cs-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .cs-tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; }
  .cs-tab { padding: 8px 14px; border-right: 1px solid var(--border); display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-dim); white-space: nowrap; font-size: 0.82rem; font-family: var(--font-display); }
  .cs-tab.active { background: var(--deep); color: var(--text); border-bottom: 2px solid var(--accent); }
  .cs-tab .close { opacity: 0.5; }
  .cs-tab .close:hover { opacity: 1; color: var(--danger); }

  #codeEditor { flex: 1; background: var(--deep); color: var(--text); border: none; padding: var(--sp-3); font-family: var(--font-display); font-size: 13px; line-height: 1.6; resize: none; outline: none; }

  .cs-preview { height: 38vh; min-height: 140px; max-height: 55vh; background: #fff; border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .cs-preview-head { padding: 6px 12px; background: var(--surface); color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; font-family: var(--font-display); }
  #previewFrame { flex: 1; border: none; background: #fff; width: 100%; }

  .cs-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); flex-direction: column; gap: var(--sp-3); text-align: center; padding: var(--sp-4); }

  @media (max-width: 700px) {
    .cs-sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; width: 240px; }
    .cs-sidebar.collapsed { width: 0; }
  }
</style>
</head>
<body>

<header class="site-header">
  <nav class="nav-bar">
    <a href="https://fish-gang.netlify.app/Company" class="brand" target="_blank" rel="noopener noreferrer"><span class="dot">●</span> Fish Gang Co.</a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Code Studio</a></li>
      <li><a href="README.md">Docs</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">☰</button>
  </nav>
  <div class="nav-drawer" id="navDrawer">
    <a href="index.html">Code Studio</a>
    <a href="README.md">Docs</a>
  </div>
</header>

<div id="app">
  <div class="cs-toolbar">
    <button id="toggleSidebar">☰ Files</button>
    <button id="newFileBtn">＋ New file</button>
    <button id="runBtn" class="run">▶ Run</button>
    <button id="downloadBtn">⭳ Download</button>
    <span class="spacer"></span>
    <span class="meta" id="statusMeta">No file open</span>
  </div>

  <div class="cs-main">
    <aside class="cs-sidebar" id="sidebar">
      <div class="cs-sidebar-head">
        <span>Files</span>
        <button id="addFileIcon" title="New file">＋</button>
      </div>
      <div class="cs-tree" id="fileTree"></div>
    </aside>

    <div class="cs-content">
      <div class="cs-tabs" id="tabBar"></div>
      <textarea id="codeEditor" placeholder="Open or create a file to start editing…" spellcheck="false"></textarea>
      <div class="cs-preview" id="previewPanel" style="display: none;">
        <div class="cs-preview-head">
          <span>Live preview</span>
          <button id="closePreview" style="background: none; border: none; color: var(--text-dim); cursor: pointer;">✕</button>
        </div>
        <iframe id="previewFrame" sandbox="allow-scripts allow-modals"></iframe>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  Built by <a href="https://fish-gang.netlify.app/Company" target="_blank" rel="noopener noreferrer">Fish Gang Co.</a> · MIT licensed
</footer>

<script src="js/perf-tier.js"></script>
<script src="js/theme-toggle.js"></script>
<script src="lib/store.js"></script>
<script>
(function () {
  'use strict';

  var store = CodeStudio.createStore(window.localStorage);
  var openTabs = [];
  var activeFile = null;

  var codeEditor = document.getElementById('codeEditor');
  var statusMeta = document.getElementById('statusMeta');
  var previewPanel = document.getElementById('previewPanel');
  var previewFrame = document.getElementById('previewFrame');

  document.getElementById('navToggle').addEventListener('click', function () {
    var open = document.getElementById('navDrawer').classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  function renderTree() {
    var tree = document.getElementById('fileTree');
    tree.textContent = '';

    var names = store.list();
    if (names.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'text-dim';
      empty.style.cssText = 'font-size: 0.8rem; padding: var(--sp-2); margin: 0;';
      empty.textContent = 'No files yet.';
      tree.appendChild(empty);
      return;
    }

    for (var i = 0; i < names.length; i++) {
      var name = names[i];
      var item = document.createElement('div');
      item.className = 'cs-tree-item' + (name === activeFile ? ' selected' : '');

      var nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = '📄 ' + name;
      nameSpan.addEventListener('click', (function (n) {
        return function () { openFile(n); };
      })(name));

      var del = document.createElement('span');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'Delete';
      del.addEventListener('click', (function (n) {
        return function (e) {
          e.stopPropagation();
          if (window.confirm('Delete ' + n + '?')) {
            store.remove(n);
            closeTab(n);
            renderTree();
          }
        };
      })(name));

      item.appendChild(nameSpan);
      item.appendChild(del);
      tree.appendChild(item);
    }
  }

  function renderTabs() {
    var bar = document.getElementById('tabBar');
    bar.textContent = '';

    for (var i = 0; i < openTabs.length; i++) {
      var name = openTabs[i];
      var tab = document.createElement('div');
      tab.className = 'cs-tab' + (name === activeFile ? ' active' : '');

      var filename = document.createElement('span');
      filename.className = 'filename';
      filename.textContent = name;
      filename.addEventListener('click', (function (n) {
        return function () { setActive(n); };
      })(name));

      var close = document.createElement('span');
      close.className = 'close';
      close.textContent = '✕';
      close.addEventListener('click', (function (n) {
        return function (e) {
          e.stopPropagation();
          closeTab(n);
        };
      })(name));

      tab.appendChild(filename);
      tab.appendChild(close);
      bar.appendChild(tab);
    }
  }

  function setActive(name) {
    activeFile = name;
    var content = store.get(name);
    codeEditor.value = content == null ? '' : content;
    var bytes = content == null ? 0 : new Blob([content]).size;
    statusMeta.textContent = name + ' · ' + bytes + ' bytes';
    renderTree();
    renderTabs();
  }

  function openFile(name) {
    if (openTabs.indexOf(name) === -1) openTabs.push(name);
    setActive(name);
  }

  function closeTab(name) {
    openTabs = openTabs.filter(function (n) { return n !== name; });
    if (activeFile === name) {
      if (openTabs.length) {
        setActive(openTabs[openTabs.length - 1]);
      } else {
        activeFile = null;
        codeEditor.value = '';
        statusMeta.textContent = 'No file open';
        renderTree();
        renderTabs();
      }
    } else {
      renderTree();
      renderTabs();
    }
  }

  codeEditor.addEventListener('input', function (e) {
    if (!activeFile) return;
    store.set(activeFile, e.target.value);
  });

  function newFile() {
    var name = window.prompt('File name (e.g. index.html):');
    if (!name) return;
    if (store.has(name)) {
      window.alert('A file with that name already exists.');
      return;
    }
    store.create(name);
    renderTree();
    openFile(name);
  }
  document.getElementById('newFileBtn').addEventListener('click', newFile);
  document.getElementById('addFileIcon').addEventListener('click', newFile);

  document.getElementById('toggleSidebar').addEventListener('click', function () {
    document.getElementById('sidebar').classList.toggle('collapsed');
  });

  document.getElementById('runBtn').addEventListener('click', function () {
    if (!activeFile) {
      window.alert('Open a file first.');
      return;
    }
    previewPanel.style.display = 'flex';
    var content = store.get(activeFile);
    previewFrame.srcdoc = content == null ? '' : content;
  });

  document.getElementById('closePreview').addEventListener('click', function () {
    previewPanel.style.display = 'none';
  });

  document.getElementById('downloadBtn').addEventListener('click', function () {
    if (!activeFile) {
      window.alert('Open a file first.');
      return;
    }
    var content = store.get(activeFile) || '';
    var blob = new Blob([content], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = activeFile;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  renderTree();

  if (store.list().length === 0) {
    store.create('index.html');
    store.set('index.html',
      '<!DOCTYPE html>\n<html>\n<head><title>Hello</title></head>\n' +
      '<body>\n  <h1>Hello from Code Studio</h1>\n</body>\n</html>'
    );
    renderTree();
    openFile('index.html');
  }
})();
</script>
</body>
</html>
